services:
  db:
    image: postgres:16
    container_name: expense-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: expense-tracker-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      JWT_SECRET: replace_with_long_random_secret
      DATABASE_URL: postgres://app_user:change_me_dev_password@db:5432/expense_tracker
      CORS_ORIGIN: http://localhost:5173,http://localhost:4000
    ports:
      - "4000:4000"

volumes:
  db_data:
